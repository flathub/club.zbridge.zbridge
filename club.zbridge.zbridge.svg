<?xml version="1.0" encoding="UTF-8"?>
<svg width="128" height="128" viewBox="0 0 128 128" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Felt Green Base Tile Gradient -->
    <linearGradient id="tileSurface" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#248a4c"/>
      <stop offset="60%" stop-color="#186335"/>
      <stop offset="100%" stop-color="#0f4523"/>
    </linearGradient>

    <!-- Top Rim Inner Highlight -->
    <linearGradient id="topHighlightRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="25%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Golden Bridge Arch Gradient -->
    <linearGradient id="gold3D" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#fff3b0"/>
      <stop offset="25%" stop-color="#ffca28"/>
      <stop offset="65%" stop-color="#f57c00"/>
      <stop offset="100%" stop-color="#b75100"/>
    </linearGradient>

    <linearGradient id="goldSpecular" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Card Edge & Surface Gradients -->
    <linearGradient id="cardFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <linearGradient id="cardThickness" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <!-- Suit Gradients -->
    <linearGradient id="spadeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="40%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>

    <!-- Crisp 3D Spade Shape with Specular Highlight -->
    <g id="spade3D">
      <path d="M 0,-16 C -2.8,-8.5 -13,-1 -13,5.5 C -13,11.5 -8,14 -2.8,12.2 C -2,12.2 -1.3,13.2 -2,16 L -4.5,20.5 L 4.5,20.5 L 2,16 C 1.3,13.2 2,12.2 2.8,12.2 C 8,14 13,11.5 13,5.5 C 13,-1 2.8,-8.5 0,-16 Z" fill="url(#spadeGrad)"/>
      <path d="M 0,-14 C -2,-8 -9,-2 -9,4 C -9,6 -7,8 -3,7 C 0,-4 -1,-10 0,-14 Z" fill="#ffffff" opacity="0.18"/>
    </g>

    <!-- Crisp 3D Heart Shape with Specular Highlight -->
    <g id="heart3D">
      <path d="M 0,14 C -2.2,12 -13,3.8 -13,-3.2 C -13,-9 -7.8,-12 -2.8,-9.8 C -1.2,-9.1 0,-7.2 0,-7.2 C 0,-7.2 1.2,-9.1 2.8,-9.8 C 7.8,-12 13,-9 13,-3.2 C 13,3.8 2.2,12 0,14 Z" fill="url(#heartGrad)"/>
      <path d="M 0,-5 C 0,-5 1,-7.5 2.3,-8 C 6.5,-9.8 10.5,-7.2 10.5,-2.5 C 10.5,2 -1,8.5 -0.5,2 C 2,2 5,-1 0,-5 Z" fill="#ffffff" opacity="0.22"/>
    </g>
  </defs>

  <!-- BASE TILE: Standard GNOME HIG 112x112 centered squircle (x=8, y=8, rx=24) -->
  <rect x="8" y="8" width="112" height="112" rx="24" ry="24" fill="url(#tileSurface)"/>
  <rect x="8" y="8" width="112" height="112" rx="24" ry="24" fill="none" stroke="#062410" stroke-width="1.5" stroke-opacity="0.6"/>
  <rect x="9" y="9" width="110" height="110" rx="23" ry="23" fill="none" stroke="url(#topHighlightRim)" stroke-width="1.25"/>

  <!-- GOLDEN BRIDGE ARCH STRUCTURE (Internal 3D lighting without filter blurs) -->
  <path d="M 22 93 C 40 49, 88 49, 106 93" fill="none" stroke="#051a0c" stroke-width="8" opacity="0.4"/>
  <path d="M 22 92 C 40 48, 88 48, 106 92" fill="none" stroke="url(#gold3D)" stroke-width="6.5" stroke-linecap="round"/>
  <path d="M 23 91.5 C 40 48.5, 88 48.5, 105 91.5" fill="none" stroke="url(#goldSpecular)" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 18 93 L 110 93" stroke="#051a0c" stroke-width="4.5" opacity="0.4"/>
  <path d="M 18 92 L 110 92" stroke="url(#gold3D)" stroke-width="3.5" stroke-linecap="round"/>

  <!-- OVERLAPPING PLAYING CARDS WITH PHYSICAL THICKNESS -->
  <!-- Card 1: Ace of Spades (Left card, tilted -12°) -->
  <g transform="translate(48, 56) rotate(-12)">
    <rect x="-19.5" y="-29.5" width="41" height="61" rx="5" fill="url(#cardThickness)"/>
    <rect x="-21" y="-31" width="42" height="62" rx="4.5" fill="url(#cardFront)" stroke="#cbd5e1" stroke-width="0.75"/>
    <use href="#spade3D" transform="scale(0.88)"/>
  </g>

  <!-- Card 2: Ace of Hearts (Right card, tilted +12°, overlapping) -->
  <g transform="translate(80, 58) rotate(12)">
    <rect x="-19.5" y="-29.5" width="41" height="61" rx="5" fill="url(#cardThickness)"/>
    <rect x="-21" y="-31" width="42" height="62" rx="4.5" fill="url(#cardFront)" stroke="#cbd5e1" stroke-width="0.75"/>
    <use href="#heart3D" transform="scale(0.88)"/>
  </g>
</svg>
