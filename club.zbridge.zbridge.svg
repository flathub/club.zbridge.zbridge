<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="128"
   height="128"
   viewBox="0 0 128 128"
   version="1.1"
   id="svg1"
   xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Modern Gradient for Main Symbol -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0A0" />
      <stop offset="45%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#C59310" />
    </linearGradient>

    <!-- Subtle Highlight Gradient for Depth without Shadow -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F2F4F7" />
    </linearGradient>
  </defs>

  <!-- Background Canvas (GNOME Standard Grid: 103x103px at 12.5, 12.5 with rx/ry 8px) -->
  <rect x="12.5" y="12.5" width="103" height="103" rx="8" ry="8" fill="#2d6b3b"/>

  <!-- Inner Decorative Felt Border -->
  <rect x="16.5" y="16.5" width="95" height="95" rx="5" ry="5" fill="none" stroke="#488e57" stroke-width="1.5" opacity="0.6"/>

  <!-- Centered Hero Emblem: Sleek Overlapping Cards & Modern Gold Suits -->
  <g transform="translate(64, 64)">

    <!-- Modern Angled Playing Card Badge -->
    <g transform="rotate(-8)">
      <rect x="-24" y="-32" width="48" height="64" rx="4" fill="url(#cardBg)" stroke="#1a3d22" stroke-width="1.5"/>
      
      <!-- Spade & Heart Mini Accents -->
      <path d="M 0 -18 C 0 -12, -7 -5, -14 -5 C -20 -5, -23 -11, -23 -17 C -23 -24, -13 -30, 0 -38 C 13 -30, 23 -24, 23 -17 C 23 -11, 20 -5, 14 -5 C 7 -5, 0 -12, 0 -18 Z" fill="#1b1b1b" transform="translate(0, 10) scale(0.35)"/>
      <path d="M 0 -18 C 0 -12, -7 -5, -14 -5 C -20 -5, -23 -11, -23 -17 C -23 -24, -13 -30, 0 -38 C 13 -30, 23 -24, 23 -17 C 23 -11, 20 -5, 14 -5 C 7 -5, 0 -12, 0 -18 Z" transform="translate(0, 10) scale(0.35) rotate(180)"/>
    </g>

    <!-- Foreground Primary Card Badge with Gold Club -->
    <g transform="rotate(8) translate(4, 2)">
      <rect x="-24" y="-32" width="48" height="64" rx="4" fill="url(#cardBg)" stroke="#1a3d22" stroke-width="1.5"/>

      <!-- Golden Club Emblem (Central Hero) -->
      <g transform="scale(0.32) translate(0, -6)">
        <circle cx="0" cy="-30" r="24" fill="url(#goldGradient)" />
        <circle cx="-25" cy="12" r="24" fill="url(#goldGradient)" />
        <circle cx="25" cy="12" r="24" fill="url(#goldGradient)" />
        <path d="M -10 12 C -10 8, 10 8, 10 12 L 18 50 L -18 50 Z" fill="url(#goldGradient)" />
      </g>
    </g>

    <!-- Bold Modern 'zB' Monogram Badge -->
    <g transform="translate(-18, 16)">
      <rect x="-16" y="-12" width="32" height="24" rx="5" fill="#1b1b1b"/>
      <text x="0" y="5" font-family="'Inter', -apple-system, sans-serif" font-size="14" font-weight="900" fill="url(#goldGradient)" text-anchor="middle" letter-spacing="-0.5">zB</text>
    </g>

  </g>

</svg>
