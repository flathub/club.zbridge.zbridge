<?xml version="1.0" encoding="UTF-8"?>
<svg width="128" height="128" viewBox="0 0 128 128" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Felt Green Base Tile Gradient -->
    <linearGradient id="tileSurface" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#228647"/>
      <stop offset="65%" stop-color="#145a2d"/>
      <stop offset="100%" stop-color="#0a361a"/>
    </linearGradient>

    <!-- Top Rim Inner Highlight -->
    <linearGradient id="topHighlightRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Golden Bridge Arch Gradient -->
    <linearGradient id="gold3D" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffeea1"/>
      <stop offset="30%" stop-color="#f5b025"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>

    <!-- Playing Card Surface Gradient -->
    <linearGradient id="cardFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="75%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <!-- Suit Gradients -->
    <linearGradient id="spadeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="40%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>

    <!-- Crisp 2D Vector Spade -->
    <g id="spadeShape">
      <path d="M 0,-15 C -2.5,-8 -12,-1 -12,5 C -12,10.5 -7.5,13 -2.5,11.5 C -1.8,11.5 -1.2,12.5 -1.8,15 L -4,19 L 4,19 L 1.8,15 C 1.2,12.5 1.8,11.5 2.5,11.5 C 7.5,13 12,10.5 12,5 C 12,-1 2.5,-8 0,-15 Z" fill="url(#spadeGrad)"/>
    </g>

    <!-- Crisp 2D Vector Heart -->
    <g id="heartShape">
      <path d="M 0,13 C -2,11 -12,3.5 -12,-3 C -12,-8.5 -7.2,-11.2 -2.5,-9.2 C -1,-8.5 0,-6.7 0,-6.7 C 0,-6.7 1,-8.5 2.5,-9.2 C 7.2,-11.2 12,-8.5 12,-3 C 12,3.5 2,11 0,13 Z" fill="url(#heartGrad)"/>
    </g>
  </defs>

  <!-- BASE TILE: Standard GNOME HIG 112x112 centered squircle (x=8, y=8, rx=24) -->
  <rect x="8" y="8" width="112" height="112" rx="24" ry="24" fill="url(#tileSurface)"/>
  <rect x="8" y="8" width="112" height="112" rx="24" ry="24" fill="none" stroke="#051f0e" stroke-width="1.5" stroke-opacity="0.5"/>
  <rect x="9" y="9" width="110" height="110" rx="23" ry="23" fill="none" stroke="url(#topHighlightRim)" stroke-width="1.25"/>

  <!-- GOLDEN BRIDGE ARCH STRUCTURE -->
  <g stroke="url(#gold3D)" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Horizontal Deck Base -->
    <path d="M 18 92 L 110 92" stroke-width="3.5"/>
    <!-- Main Arch Ribbon -->
    <path d="M 22 92 C 40 48, 88 48, 106 92" stroke-width="6"/>
  </g>

  <!-- OVERLAPPING PLAYING CARDS -->
  <!-- Card 1: Ace of Spades (Left card, tilted -12°) -->
  <g transform="translate(48, 56) rotate(-12)">
    <rect x="-20" y="-30" width="40" height="60" rx="4" fill="url(#cardFront)" stroke="#cbd5e1" stroke-width="1"/>
    <use href="#spadeShape" transform="scale(0.85)"/>
  </g>

  <!-- Card 2: Ace of Hearts (Right card, tilted +12°) -->
  <g transform="translate(80, 58) rotate(12)">
    <rect x="-20" y="-30" width="40" height="60" rx="4" fill="url(#cardFront)" stroke="#cbd5e1" stroke-width="1"/>
    <use href="#heartShape" transform="scale(0.85)"/>
  </g>
</svg>
